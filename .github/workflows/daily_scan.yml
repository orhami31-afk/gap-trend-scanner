name: Daily Gap & Trend Scan

on:
  schedule:
    - cron: '30 19 * * 1-5'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run daily scan
        run: python main.py

      - name: Commit local backup back to repo
        run: |
          git config user.name "gap-trend-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history/ gap_trend_bot.log
          git diff --staged --quiet || git commit -m "Daily scan results"
          git push
